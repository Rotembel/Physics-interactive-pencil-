<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Sketch Physics</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>✏️ Sketch Physics</h1>
    <p class="tagline">Draw with your Apple Pencil, press Play, and watch real physics take over.</p>
  </header>

  <main>
    <section class="toolbar" aria-label="Drawing tools">
      <div class="tool-group" id="toolGroup" role="radiogroup" aria-label="Tool">
        <button class="tool-btn" data-tool="shape" role="radio" aria-checked="true">
          <span class="tool-icon">🔷</span> Shape
        </button>
        <button class="tool-btn" data-tool="ramp" role="radio" aria-checked="false">
          <span class="tool-icon">📐</span> Ramp
        </button>
        <button class="tool-btn" data-tool="pin" role="radio" aria-checked="false">
          <span class="tool-icon">📌</span> Pin
        </button>
        <button class="tool-btn" data-tool="erase" role="radio" aria-checked="false">
          <span class="tool-icon">🧹</span> Erase
        </button>
      </div>

      <div class="sliders">
        <label>
          Gravity
          <input type="range" id="gravitySlider" min="0" max="3" step="0.1" value="1" />
        </label>
        <label>
          Friction
          <input type="range" id="frictionSlider" min="0" max="1" step="0.05" value="0.3" />
        </label>
        <label>
          Bounciness
          <input type="range" id="restitutionSlider" min="0" max="1" step="0.05" value="0.2" />
        </label>
      </div>

      <div class="run-controls">
        <button id="playBtn" class="primary-btn" type="button">▶ Play</button>
        <button id="resetBtn" type="button">⟲ Reset</button>
      </div>
    </section>

    <p class="tool-tip" id="toolTip" aria-live="polite"></p>

    <section class="canvas-wrap">
      <canvas id="physicsCanvas"></canvas>
    </section>
  </main>

  <footer class="app-footer">
    <p>Built for iPad + Apple Pencil — pressure-sensitive drawing, palm rejection, and a live physics engine.</p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
